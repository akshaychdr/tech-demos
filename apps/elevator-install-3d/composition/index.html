<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body, #stage {
        width: 1920px; height: 1080px; overflow: hidden;
        background: #0a1628; color: #e6f1ff;
        font-family: Inter, system-ui, sans-serif;
      }
      #stage { position: relative; }
      .layer { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
      #layer-title { padding: 80px; z-index: 20; }
      #layer-title h1 { font-size: 72px; color: #38d6ff; margin: 12px 0; }
      #layer-title .tag { color: #ff8a3d; font-size: 22px; font-weight: 600; }
      #layer-title p { font-size: 28px; color: #8ba4c7; max-width: 900px; line-height: 1.45; }
      #layer-plan { z-index: 5; display: flex; align-items: center; justify-content: center; }
      #layer-plan svg { width: 1100px; height: auto; }
      #canvas-layout, #canvas-curtain { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #layer-wiring { z-index: 8; padding: 48px 40px 20px; }
      #layer-wiring svg { width: 100%; height: auto; }
      #caption {
        position: absolute; left: 80px; bottom: 56px; z-index: 30;
        font-size: 26px; color: #e6f1ff; max-width: 1100px;
        text-shadow: 0 2px 24px #0a1628;
      }
      #caption .word { display: inline-block; opacity: 0; transform: translateY(12px); filter: blur(4px); }
      .dim-line { stroke: #38d6ff; stroke-width: 2; fill: none; stroke-dasharray: 400; stroke-dashoffset: 400; }
      .plan-shape { fill: none; stroke: #38d6ff; stroke-width: 2; stroke-dasharray: 1200; stroke-dashoffset: 1200; }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="elevator-install-3d"
      data-duration="90"
      data-width="1920"
      data-height="1080"
      data-fps="60"
    >
      <div id="layer-title" class="layer">
        <div class="tag">Illustrative demo, not for installation</div>
        <h1>Install in 3D</h1>
        <p>Federal Panorama/Renaissance · Type A layout, IR curtain, disconnect wiring — millimetres throughout.</p>
      </div>
      <div id="layer-plan" class="layer">
        <svg id="plan-svg" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <canvas id="canvas-layout"></canvas>
      <canvas id="canvas-curtain"></canvas>
      <div id="layer-wiring" class="layer"></div>
      <div id="caption"></div>
    </div>
    <script type="module" src="./scene.js"></script>
  </body>
</html>
