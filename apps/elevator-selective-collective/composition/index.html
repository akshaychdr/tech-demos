<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: #040810;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #stage {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
      }
      #camera { position: absolute; inset: 0; transform-origin: 71% 44%; }
      #plate-wrap {
        position: absolute; inset: 0;
        opacity: 0;
        transition: filter 0.6s ease;
      }
      #plate-wrap.dimmed { filter: saturate(0.4) brightness(0.5); }
      #plate {
        width: 100%; height: 100%; object-fit: cover; display: block;
      }
      #overlay {
        position: absolute; inset: 0; width: 1920px; height: 1080px;
        pointer-events: none; z-index: 12;
      }
      .route-path { fill: none; stroke-width: 3; stroke-dasharray: 6 8; opacity: 0; }
      .route-down { stroke: #fb923c; filter: url(#orangeGlow); }
      .route-sel { stroke: #22d3ee; filter: url(#cyanGlow); }
      .call-path { fill: none; stroke: #f472b6; stroke-width: 2.5; stroke-dasharray: 4 6; opacity: 0; filter: url(#magentaGlow); }
      .call-circle { fill: #ec4899; filter: url(#magentaGlow); }
      .call-num, .call-dir { fill: #fff; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .floor-label { fill: #e2e8f0; font-size: 15px; font-weight: 600; text-shadow: 0 0 12px rgba(0,0,0,0.9); }
      .hall-btn { fill: #1e293b; stroke: #94a3b8; stroke-width: 1; }
      .hall-lantern { fill: #f472b6; filter: url(#magentaGlow); }
      .rope {
        stroke: #67e8f9; stroke-width: 2.5; fill: none; opacity: 0.92;
        filter: url(#cyanGlow);
      }
      #car {
        position: absolute; left: 0; top: 0; z-index: 20;
        opacity: 0;
        overflow: visible;
        min-width: 80px; min-height: 80px;
      }
      #car-indicator {
        position: absolute; left: 50%; top: -34px;
        transform: translateX(-50%);
        min-width: 52px; padding: 5px 10px;
        background: rgba(2, 8, 18, 0.94);
        border: 1px solid rgba(34, 211, 238, 0.95);
        border-radius: 4px;
        color: #a5f3fc; font-size: 14px; font-weight: 700;
        font-variant-numeric: tabular-nums;
        text-align: center; letter-spacing: 0.06em;
        text-shadow: 0 0 10px rgba(34, 211, 238, 0.9);
        box-shadow: 0 0 18px rgba(34, 211, 238, 0.45), inset 0 0 12px rgba(34, 211, 238, 0.15);
        z-index: 8;
      }
      .neon-cab {
        position: relative; width: 100%; height: 100%;
        filter: drop-shadow(0 0 16px rgba(34, 211, 238, 0.35));
      }
      .neon-cab-crosshead {
        position: absolute; top: -5px; left: 28%; right: 28%; height: 5px;
        background: linear-gradient(90deg, #475569, #94a3b8, #475569);
        border-radius: 2px;
        box-shadow: 0 0 10px rgba(34, 211, 238, 0.55);
      }
      .neon-cab-body {
        position: absolute; inset: 0;
        border-radius: 5px;
        background: linear-gradient(165deg, rgba(10, 28, 48, 0.88) 0%, rgba(4, 12, 24, 0.94) 55%, rgba(8, 20, 36, 0.9) 100%);
        border: 2px solid rgba(34, 211, 238, 0.85);
        box-shadow:
          0 0 22px rgba(34, 211, 238, 0.4),
          inset 0 0 28px rgba(34, 211, 238, 0.1),
          inset 0 -12px 24px rgba(236, 72, 153, 0.08);
      }
      .neon-cab-body::after {
        content: "";
        position: absolute; inset: 3px; border-radius: 3px;
        border: 1px solid rgba(236, 72, 153, 0.28);
        pointer-events: none;
      }
      .neon-cab-light {
        position: absolute; top: 8%; left: 12%; right: 12%; height: 9%;
        border-radius: 2px;
        background: linear-gradient(180deg, rgba(254, 243, 199, 0.55), rgba(251, 191, 36, 0.2));
        box-shadow: 0 0 16px rgba(251, 191, 36, 0.35);
      }
      .neon-rail {
        position: absolute; left: 10%; right: 10%; bottom: 30%; height: 3px;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, rgba(203, 213, 225, 0.85), transparent);
        opacity: 0.85;
      }
      .neon-door {
        position: absolute; top: 22%; bottom: 10%; width: 46%;
        background: linear-gradient(180deg, rgba(51, 65, 85, 0.95), rgba(30, 41, 59, 0.98));
        border: 1px solid rgba(148, 163, 184, 0.65);
        box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.55);
        transition: transform 0.08s linear, opacity 0.08s linear;
      }
      .neon-door::before {
        content: "";
        position: absolute; top: 12%; bottom: 12%; width: 2px;
        background: linear-gradient(180deg, transparent, rgba(34, 211, 238, 0.7), transparent);
      }
      .door-left { left: 4%; transform-origin: left center; }
      .door-left::before { right: 8%; }
      .door-right { right: 4%; transform-origin: right center; }
      .door-right::before { left: 8%; }
      .neon-cab-glow-edge {
        position: absolute; inset: 0; border-radius: 5px; pointer-events: none;
        box-shadow: inset 0 0 0 1px rgba(103, 232, 249, 0.25);
      }
      .landing-waiter {
        position: absolute; z-index: 22;
        opacity: 0;
        filter: drop-shadow(0 0 14px rgba(244, 114, 182, 0.65));
        transform: translate(-50%, -62%);
        pointer-events: none;
      }
      .landing-waiter img { height: 118px; width: auto; display: block; }
      .in-car-rider {
        position: absolute; bottom: 14%; z-index: 6;
        opacity: 1;
        filter: drop-shadow(0 0 10px rgba(244, 114, 182, 0.45));
      }
      .in-car-rider img { height: 72px; width: auto; display: block; }
      .left-panel {
        position: absolute; left: 96px; top: 0; width: 700px; height: 100%;
        z-index: 30; pointer-events: none;
      }
      .left-panel::before {
        content: "";
        position: absolute; left: -96px; top: 0;
        width: 860px; height: 62%;
        background: linear-gradient(180deg, rgba(4, 8, 18, 0.82) 0%, rgba(4, 8, 18, 0.45) 55%, transparent 100%);
        z-index: -1; pointer-events: none;
      }
      #typography { position: absolute; top: 200px; color: #f8fafc; max-width: 620px; }
      #headline {
        font-size: 88px; font-weight: 600; letter-spacing: -0.04em; line-height: 1.02;
        text-shadow: 0 0 80px rgba(34, 211, 238, 0.35);
      }
      #headline .word { display: inline-block; opacity: 0; }
      #subhead { margin-top: 22px; font-size: 32px; font-weight: 300; color: #cbd5e1; opacity: 0; }
      #scene-caption {
        position: absolute; left: 0; top: 96px; width: 100%; max-width: 660px; opacity: 0;
        padding: 20px 24px; border-radius: 12px;
        background: rgba(4, 8, 18, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.15);
      }
      #scene-caption h2 {
        font-size: 36px; font-weight: 600; color: #f1f5f9; margin-bottom: 10px; line-height: 1.15;
        text-shadow: 0 2px 24px rgba(0,0,0,0.85);
      }
      #scene-caption p {
        font-size: 23px; color: #cbd5e1; line-height: 1.45; max-width: 620px;
        text-shadow: 0 2px 20px rgba(0,0,0,0.9);
      }
      #stats {
        position: absolute; left: 0; top: 160px; width: 100%; max-width: 660px;
        opacity: 0; z-index: 40;
        background: rgba(8, 12, 22, 0.9); border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 16px; padding: 28px 32px;
        box-shadow: 0 24px 80px rgba(0,0,0,0.55);
      }
      #stats h2 { font-size: 32px; color: #f1f5f9; margin-bottom: 8px; }
      #stats .lead { font-size: 18px; color: #94a3b8; margin-bottom: 24px; }
      .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      .stat-head { font-size: 13px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
      .stat-value { font-size: 48px; font-weight: 700; line-height: 1; margin-bottom: 8px; }
      .stat-down { color: #fb923c; }
      .stat-sel { color: #22d3ee; }
      .stat-bar-bg { height: 8px; background: #0f172a; border-radius: 4px; overflow: hidden; margin-bottom: 16px; }
      .stat-bar { height: 100%; width: 0; border-radius: 4px; }
      .bar-down { background: linear-gradient(90deg, #fb923c, #fdba74); }
      .bar-sel { background: linear-gradient(90deg, #06b6d4, #67e8f9); }
      #wait-footnote {
        margin-top: 16px; font-size: 14px; color: #94a3b8; line-height: 1.5;
        background: rgba(2, 6, 14, 0.95); padding: 12px 14px; border-radius: 8px;
        border: 1px solid rgba(71, 85, 105, 0.45);
      }
      #logo-line { position: absolute; left: 0; bottom: 48px; font-size: 16px; color: #64748b; opacity: 0; }
      .call-badge { opacity: 0; }
      .call-badge.lit { opacity: 1; }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="selective-collective"
      data-start="0"
      data-duration="38"
      data-width="1920"
      data-height="1080"
      data-fps="60"
    >
      <div id="camera">
        <div id="plate-wrap">
          <img id="plate" src="art/processed/plate-tower-1080p.jpg" alt="" width="1920" height="1080" />
        </div>

        <svg id="overlay" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="cyanGlow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <filter id="magentaGlow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <filter id="orangeGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <filter id="ropeGlow"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <path id="rope" class="rope" d=""/>
          <g id="floor-labels"></g>
          <g id="landings"></g>
          <g id="call-paths"></g>
          <path id="path-down" class="route-path route-down"/>
          <path id="path-selective" class="route-path route-sel"/>
          <g id="calls"></g>
        </svg>

        <div id="car">
          <div id="car-indicator">▲ 1</div>
          <div class="neon-cab">
            <div class="neon-cab-crosshead" aria-hidden="true"></div>
            <div class="neon-cab-body">
              <div class="neon-cab-light" aria-hidden="true"></div>
              <div class="neon-rail" aria-hidden="true"></div>
              <div class="neon-door door-left" aria-hidden="true"></div>
              <div class="neon-door door-right" aria-hidden="true"></div>
              <div class="neon-cab-glow-edge" aria-hidden="true"></div>
              <div class="in-car-rider" id="rider-lobby" style="left: 18%">
                <img src="art/processed/passenger-1.png" alt="" />
              </div>
            </div>
          </div>
        </div>

        <div class="landing-waiter" id="waiter-4" data-floor="4">
          <img src="art/processed/passenger-2.png" alt="" />
        </div>
        <div class="landing-waiter" id="waiter-7" data-floor="7">
          <img src="art/processed/passenger-3.png" alt="" />
        </div>
        <div class="landing-waiter" id="waiter-8" data-floor="8">
          <img src="art/processed/passenger-4.png" alt="" />
        </div>

        <div class="left-panel">
          <div id="typography">
            <h1 id="headline"><span class="word">Going</span> <span class="word">up?</span></h1>
            <p id="subhead">I'll grab you on the way.</p>
          </div>
          <div id="scene-caption" class="clip" data-start="0" data-duration="38" data-track-index="1">
            <h2 id="cap-title"></h2>
            <p id="cap-body"></p>
          </div>
          <div id="stats">
            <h2>Same passengers · same physics</h2>
            <p class="lead">Mean wait and mean journey from simulation</p>
            <div class="stat-grid">
              <div>
                <div class="stat-head">Down collective — mean wait</div>
                <div id="val-down-wait" class="stat-value stat-down">—</div>
                <div class="stat-bar-bg"><div id="bar-down-wait" class="stat-bar bar-down"></div></div>
                <div class="stat-head">Mean journey</div>
                <div id="val-down-journey" class="stat-value stat-down" style="font-size:32px">—</div>
              </div>
              <div>
                <div class="stat-head">Selective collective — mean wait</div>
                <div id="val-sel-wait" class="stat-value stat-sel">—</div>
                <div class="stat-bar-bg"><div id="bar-sel-wait" class="stat-bar bar-sel"></div></div>
                <div class="stat-head">Mean journey</div>
                <div id="val-sel-journey" class="stat-value stat-sel" style="font-size:32px">—</div>
              </div>
            </div>
            <p id="wait-footnote"></p>
          </div>
          <div id="logo-line">HyperFrames · Barney / Harris terminology</div>
        </div>
      </div>
    </div>
    <script type="module">
      import { initComposition } from './scene.js'
      initComposition()
    </script>
  </body>
</html>
